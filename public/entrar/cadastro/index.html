<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title data-i18n="cadastro.titulo">Cadastro · Taioé</title>
<link rel="stylesheet" href="/comum/estilo.css">
</head>
<body>
<header class="topo">
  <a class="marca" href="/">Taioé</a>
  <nav><button type="button" class="ligacao" id="sair" data-i18n="comum.sair">Sair</button></nav>
</header>

<main>
  <section id="carregando"><p class="apagado" data-i18n="comum.carregando">Carregando…</p></section>

  <form id="form" hidden novalidate>
    <h1 id="titulo" data-i18n="cadastro.h1">Falta pouco</h1>
    <p><span data-i18n="comum.conta">Conta:</span> <strong id="email"></strong></p>
    <p id="explica-novo-aceite" class="aviso" hidden data-i18n="cadastro.novo-aceite">Os termos de uso ou a política de privacidade mudaram. Para continuar, leia e aceite a versão nova.</p>

    <div id="bloco-nome">
      <label for="nome" data-i18n="cadastro.nome">Como você quer ser chamado?</label>
      <input type="text" id="nome" maxlength="40" autocomplete="nickname" required>
      <p class="pequeno apagado" data-i18n="cadastro.nome-explica">Só para a Taioé falar com você. Pode ser um apelido.</p>
    </div>

    <label class="marcar"><input type="checkbox" id="aceite" required>
      <span><span id="aceite-texto" data-i18n-html="cadastro.aceite" data-i18n-vars='{"termos":"/termos/","politica":"/privacidade/"}'>Li e aceito os <a href="/termos/" target="_blank" rel="noopener">termos de uso</a> e a <a href="/privacidade/" target="_blank" rel="noopener">política de privacidade</a></span>
      <span class="apagado pequeno" id="versoes"></span>.</span></label>

    <button type="submit" id="salvar" data-i18n="comum.continuar">Continuar</button>
    <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
  </form>
</main>

<footer class="rodape">
  <a href="/privacidade/" data-i18n="comum.privacidade">Privacidade</a>
  <a href="/termos/" data-i18n="comum.termos">Termos de uso</a>
  <a href="mailto:contato@taioe.com.br">contato@taioe.com.br</a>
  <label class="lingua"><span class="so-leitor" data-i18n="comum.lingua">Língua</span>
    <select data-seletor-lingua>
      <option value="pt" lang="pt-BR">Português</option>
      <option value="es" lang="es">Español</option>
      <option value="en" lang="en">English</option>
    </select></label>
</footer>
<script src="/comum/textos-i18n.js"></script>
<script src="/comum/i18n.js"></script>
<script src="/comum/vendor/supabase-js-2.117.2.js"></script>
<script src="/comum/taioe-sessao.js"></script>
<script src="/comum/hub.js"></script>
<script src="/entrar/cadastro/cadastro.js"></script>
</body>
</html>
