<link rel="stylesheet" href="/comum/estilo.css">

<body>
<header class="topo">
  <a class="marca" href="/admin/">Administração</a>
  <nav><a href="/conta/">Conta</a></nav>
</header>

<main class="revisao pedidos">
  <div class="barra" id="barra" hidden>
    <a class="voltar" href="/admin/" aria-label="Voltar à Administração">← <span class="palavra">Administração</span></a>
    <h1 class="titulo-barra">Pedidos</h1>
    <span class="faltam" id="contagem" aria-live="polite"></span>
    <a class="ir-sugestoes" href="/admin/sugestoes/">Sugestões</a>
  </div>
  <p id="carregando" class="apagado">Carregando…</p>
  <div id="aviso" class="aviso erro" role="status"></div>
  <div id="conteudo" hidden>
    <p class="explica">Os livros que você pediu, de todas as categorias, numa fila só. O Claude faz sempre o primeiro. Mude a ordem com as setas: grava sozinho.</p>
    <section id="andamento" hidden>
      <h2>Em andamento</h2>
      <ul class="lista-fim" id="lista-andamento"></ul>
    </section>
    <section>
      <h2>Fila</h2>
      <p class="estado-ordem pequeno" id="estado-ordem" aria-live="polite"></p>
      <ol class="fila" id="fila"></ol>
    </section>
  </div>
</main>

<footer class="rodape">

</footer>
